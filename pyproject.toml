[project]
name = "agi-assistant"
version = "1.0.0"
description = "支持 RAG、记忆、工具与任务图的 Python 智能体系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "python-multipart>=0.0.20",
  "pypdf>=5.1",
  "psycopg[binary]>=3.2",
  "elasticsearch[async]>=8.17,<9",
  "pymilvus>=2.5",
  "neo4j>=5.27",
  "aiokafka>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[project.scripts]
agi-assistant = "agi_assistant.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agi_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/agi_assistant/api.py" = ["B008"]
